# Apache — content negotiation for markdown
# Requires mod_rewrite and mod_headers

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Serve markdown when Accept: text/markdown is present
    RewriteCond %{HTTP_ACCEPT} text/markdown
    RewriteRule ^articles/([^/]+)/?$ /articles/$1.md [L]
</IfModule>

# Set correct content type for .md files
<FilesMatch "\.md$">
    ForceType text/markdown
    Header set Content-Type "text/markdown; charset=utf-8"
    Header set Cache-Control "public, max-age=3600"
    Header set X-Content-Format "markdown"
</FilesMatch>
