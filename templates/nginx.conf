# Nginx — content negotiation for markdown
# Serve .md files when client sends Accept: text/markdown
# Place inside your server {} block, adjusting paths to match your URL structure

# Example: /articles/my-post/ → serves dist/articles/my-post.md for AI clients
location ~ ^/articles/([^/]+)/?$ {
    set $slug $1;
    if ($http_accept ~* "text/markdown") {
        rewrite ^ /articles/$slug.md last;
    }
    try_files $uri $uri/index.html =404;
}

# Serve .md files with correct content type
location ~ ^/articles/.+\.md$ {
    default_type text/markdown;
    add_header Content-Type "text/markdown; charset=utf-8";
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Format "markdown";
    try_files $uri =404;
}

# For multiple collections, duplicate the location blocks:
# location ~ ^/blog/([^/]+)/?$ { ... }
# location ~ ^/case-studies/([^/]+)/?$ { ... }
